<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Live Location App</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script src="firebase-config.js"></script>
    <script src="login.js"></script>
    <script src="user-tracker.js"></script>
    <script src="admin-dashboard.js"></script>
</head>
<body>

<div id="loginDiv">
    <h2>Login / Sign Up</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="togglePassword()">Show/Hide Password</button>
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>

    <button id="resendBtn" onclick="resendVerification()" style="display:none;">
        Resend Verification Email
    </button>
</div>

<div id="mapDiv" style="display:none;">
    <h3 id="userNameDisplay"></h3>
    <button onclick="logout()">Logout</button>
    <div id="map" style="height:500px;width:100%;"></div>
    <div id="userList"></div>
</div>

<!-- Google Maps API -->
<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBsX4e37Z8edbYUN0vHrocvhngr2DhPovI&callback=initMap">
</script>

</body>
</html>
